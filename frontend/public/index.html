<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="QueryForge: High-performance parallel SQL query coordination engine with dynamic dataset sharding." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Google Web Fonts Preconnect & Injections -->
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>QueryForge | Distributed SQL Optimization Engine</title>
     <style>
    /* 🪐 Professional Ambient Mesh and Glowing Pulsing Animations */
    @keyframes meshMovement {
      0% { background-position: 0% 50%; opacity: 0.85; }
      50% { background-position: 100% 50%; opacity: 1; }
      100% { background-position: 0% 50%; opacity: 0.85; }
    }

    @keyframes subtleGlow {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.4; filter: blur(80px); }
      50% { transform: scale(1.15) translate(20px, -10px); opacity: 0.6; filter: blur(100px); }
    }

    html, body, #root, .App, [data-testid="app-shell"] {
      min-height: 100vh !important;
      position: relative;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      
      /* Vibrant, balanced professional dark velvet base layout */
      background: radial-gradient(circle at 10% 15%, #18093d 0%, #060713 45%),
                  radial-gradient(circle at 90% 40%, #3d053a 0%, #060713 55%),
                  linear-gradient(135deg, #09041a 0%, #050508 100%) !important;
      background-color: #050508 !important;
    }

    /* 🌟 Shining Decorative Layer: Injects a glowing core right into the top-left quadrant */
    html::before {
      content: "";
      position: absolute;
      top: -10%;
      left: -5%;
      width: 50vw;
      height: 50vh;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.35) 0%, rgba(236, 72, 153, 0.15) 40%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: subtleGlow 12s ease-in-out infinite;
    }

    /* Translucent premium glass container cards override rules */
    .bg-slate-900, [className*="bg-slate-900"], .qf-card, header, aside {
      background-color: rgba(12, 14, 28, 0.72) !important;
      border: 1px solid rgba(77, 91, 255, 0.22) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 30px 2px rgba(189, 0, 255, 0.02) !important;
    }

    /* Input focus boxes and SQL text workbench area rules */
    .bg-slate-950, [className*="bg-slate-950"], input, select {
      background-color: #03040a !important;
      border-color: #1e2548 !important;
    }
  </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
